name: kuat-akberen-student-api

services:
  app:
    image: kuat-akberen-student-api:${IMAGE_TAG:-v1.1-kuat-akberen}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kuat-akberen-app
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=${POSTGRES_USER:?set in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:?set in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kuat-akberen-network
    restart: on-failure

  db:
    image: postgres:15-alpine
    container_name: kuat-akberen-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?set in .env}
      - POSTGRES_USER=${POSTGRES_USER:?set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - kuat-akberen-pgdata:/var/lib/postgresql/data
    networks:
      - kuat-akberen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kuat-akberen-network:
    driver: bridge

volumes:
  kuat-akberen-pgdata:
